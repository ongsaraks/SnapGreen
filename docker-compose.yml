version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snapgreen_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ROBOFLOW_API_KEY=${ROBOFLOW_API_KEY:-T7uEFXRKxnlKwmjBGbBD}
      - ROBOFLOW_MODEL_ID=${ROBOFLOW_MODEL_ID:-trash-classification-swoem}
      - ROBOFLOW_MODEL_VERSION=${ROBOFLOW_MODEL_VERSION:-3}
      - ROBOFLOW_TIMEOUT=${ROBOFLOW_TIMEOUT:-75}
      - ROBOFLOW_API_URL=${ROBOFLOW_API_URL:-https://detect.roboflow.com}
      # Set DATABASE_URL to connect to external PostgreSQL / Supabase if desired:
      # - DATABASE_URL=postgresql://user:pass@host:5432/dbname
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - snapgreen_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: snapgreen_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - snapgreen_network

volumes:
  backend_data:

networks:
  snapgreen_network:
    driver: bridge
